<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AcciSense | Intelligent Dispatch Dashboard</title>
    
    <!-- Leaflet CSS for Map (No API Key Required) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        :root {
            --bg-primary: #0b0f19;
            --bg-secondary: #111827;
            --bg-card: #1f2937;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --accent-blue: #3b82f6;
            --accent-red: #ef4444;
            --accent-orange: #f97316;
            --accent-yellow: #eab308;
            --accent-green: #22c55e;
            --border-color: #374151;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        header {
            background: var(--bg-secondary);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
            z-index: 1000;
        }

        .logo { font-size: 1.5rem; font-weight: 800; letter-spacing: 1px; color: var(--accent-blue); }
        .logo span { color: var(--text-primary); }

        .header-controls { display: flex; gap: 20px; align-items: center; }
        .live-clock { font-family: monospace; font-size: 1.1rem; color: var(--accent-green); }
        
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            font-size: 0.9rem;
        }
        .btn-primary { background: var(--accent-blue); color: white; }
        .btn-primary:hover { background: #2563eb; }
        .btn-danger { background: var(--accent-red); color: white; }
        .btn-success { background: var(--accent-green); color: white; }
        .btn-sm { padding: 4px 10px; font-size: 0.75rem; }
        
        .audio-toggle {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .audio-toggle.active { border-color: var(--accent-green); color: var(--accent-green); }

        /* Stats Bar */
        .stats-bar {
            display: flex;
            gap: 16px;
            padding: 16px 24px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
        }
        .stat-card {
            flex: 1;
            background: var(--bg-card);
            padding: 12px 20px;
            border-radius: 8px;
            border-left: 4px solid var(--accent-blue);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .stat-card.critical { border-left-color: var(--accent-red); }
        .stat-card.ack { border-left-color: var(--accent-yellow); }
        .stat-value { font-size: 1.8rem; font-weight: bold; }
        .stat-label { font-size: 0.85rem; color: var(--text-secondary); text-transform: uppercase; }

        /* Main Layout */
        main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* Left Panel */
        .left-panel {
            width: 400px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
            background: var(--bg-secondary);
        }

        .panel-section {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
        }
        .panel-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
        }

        /* Form */
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 0.8rem; margin-bottom: 4px; color: var(--text-secondary); }
        select, input {
            width: 100%;
            padding: 8px 12px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 0.9rem;
        }
        select:focus, input:focus { outline: none; border-color: var(--accent-blue); }
        
        .location-hint { font-size: 0.75rem; color: var(--accent-blue); margin-top: 4px; cursor: pointer; }

        /* Live Feed */
        .feed-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }
        .feed-container::-webkit-scrollbar { width: 6px; }
        .feed-container::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }

        .incident-card {
            background: var(--bg-card);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            border-left: 4px solid var(--accent-blue);
            animation: slideIn 0.3s ease-out;
            position: relative;
        }
        .incident-card.critical { border-left-color: var(--accent-red); background: rgba(239, 68, 68, 0.1); }
        .incident-card.high { border-left-color: var(--accent-orange); }
        .incident-card.medium { border-left-color: var(--accent-yellow); }
        .incident-card.low { border-left-color: var(--accent-green); }

        .incident-header { display: flex; justify-content: space-between; margin-bottom: 6px; }
        .incident-type { font-weight: bold; font-size: 0.95rem; }
        .incident-time { font-size: 0.75rem; color: var(--text-secondary); }
        .incident-loc { font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 8px; }
        
        .incident-actions { display: flex; gap: 8px; margin-top: 10px; }
        .badge {
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .badge-new { background: var(--accent-blue); }
        .badge-ack { background: var(--accent-yellow); color: black; }
        .badge-resolved { background: var(--accent-green); }

        /* Right Panel (Map) */
        .right-panel {
            flex: 1;
            position: relative;
        }
        #map { height: 100%; width: 100%; z-index: 1; }
        
        .map-overlay {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(17, 24, 39, 0.9);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(5px);
            font-size: 0.85rem;
            display: flex;
            gap: 15px;
        }
        .map-overlay span { color: var(--accent-green); font-weight: bold; }

        /* Toast Notification */
        .toast-container {
            position: fixed;
            top: 80px;
            right: 20px;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .toast {
            background: var(--bg-card);
            border-left: 4px solid var(--accent-red);
            padding: 15px 20px;
            border-radius: 6px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            animation: slideInRight 0.4s ease-out;
            min-width: 300px;
        }
        .toast-title { font-weight: bold; color: var(--accent-red); margin-bottom: 4px; }
        .toast-msg { font-size: 0.85rem; color: var(--text-secondary); }

        @keyframes slideIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes slideInRight { from { opacity: 0; transform: translateX(100px); } to { opacity: 1; transform: translateX(0); } }
        
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
        .pulse { animation: pulse 2s infinite; }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">ACCISENSE <span>| Dispatch</span></div>
        <div class="header-controls">
            <div class="live-clock" id="liveClock">--:--:--</div>
            <button class="btn audio-toggle active" id="audioToggle">🔊 Audio ON</button>
            <button class="btn btn-primary" onclick="simulateIncoming()">🚨 Simulate Incoming</button>
        </div>
    </header>

    <!-- Stats Bar -->
    <div class="stats-bar">
        <div class="stat-card">
            <div>
                <div class="stat-label">Active Incidents</div>
                <div class="stat-value" id="statActive">0</div>
            </div>
            <div style="font-size: 2rem; opacity: 0.2;">🚨</div>
        </div>
        <div class="stat-card critical">
            <div>
                <div class="stat-label">Critical Priority</div>
                <div class="stat-value" id="statCritical">0</div>
            </div>
            <div style="font-size: 2rem; opacity: 0.2;">⚠️</div>
        </div>
        <div class="stat-card ack">
            <div>
                <div class="stat-label">Acknowledged</div>
                <div class="stat-value" id="statAck">0</div>
            </div>
            <div style="font-size: 2rem; opacity: 0.2;">🚓</div>
        </div>
    </div>

    <!-- Main Content -->
    <main>
        <!-- Left Panel: Form & Feed -->
        <div class="left-panel">
            <div class="panel-section">
                <div class="panel-title">🚨 Report New Incident</div>
                <form id="incidentForm">
                    <div class="form-group">
                        <label>Incident Type</label>
                        <select id="incType" required>
                            <option value="Vehicle Accident">Vehicle Accident</option>
                            <option value="Multi-Vehicle Collision">Multi-Vehicle Collision</option>
                            <option value="Pedestrian Incident">Pedestrian Incident</option>
                            <option value="Road Hazard">Road Hazard</option>
                            <option value="Medical Emergency">Medical Emergency</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Severity</label>
                        <select id="incSeverity" required>
                            <option value="Critical">Critical</option>
                            <option value="High">High</option>
                            <option value="Medium">Medium</option>
                            <option value="Low">Low</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Location (GPS)</label>
                        <input type="text" id="incLocation" placeholder="Click on map to auto-fill..." readonly required>
                        <div class="location-hint" onclick="document.getElementById('map').focus()">📍 Click map to set coordinates</div>
                    </div>
                    <button type="submit" class="btn btn-danger" style="width: 100%; margin-top: 10px;">DISPATCH ALERT</button>
                </form>
            </div>

            <div class="panel-title" style="padding: 15px 20px 0;">📡 Live Incident Feed</div>
            <div class="feed-container" id="liveFeed">
                <!-- Incidents will inject here -->
            </div>
        </div>

        <!-- Right Panel: Map -->
        <div class="right-panel">
            <div class="map-overlay">
                <div>Network: <span>STABLE</span></div>
                <div>Latency: <span id="latency">42ms</span></div>
                <div>Nodes: <span>14/14</span></div>
            </div>
            <div id="map"></div>
        </div>
    </main>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // ==========================================
        // 1. MAP INITIALIZATION (Leaflet / OpenStreetMap)
        // ==========================================
        const map = L.map('map').setView([26.8467, 80.9462], 13); // Default: uttar pradesh
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        let selectedCoords = null;
        let markers = [];

        // Click on map to set location
        map.on('click', function(e) {
            selectedCoords = e.latlng;
            document.getElementById('incLocation').value = `${e.latlng.lat.toFixed(5)}, ${e.latlng.lng.toFixed(5)}`;
            
            // Add temporary marker
            L.marker(e.latlng, {opacity: 0.5}).addTo(map);
        });

        // ==========================================
        // 2. AUDIO ALERT SYSTEM (Web Audio API - 5 Sec Beep)
        // ==========================================
        let audioEnabled = true;
        const audioToggleBtn = document.getElementById('audioToggle');
        
        audioToggleBtn.addEventListener('click', () => {
            audioEnabled = !audioEnabled;
            audioToggleBtn.textContent = audioEnabled ? '🔊 Audio ON' : '🔇 Audio OFF';
            audioToggleBtn.classList.toggle('active', audioEnabled);
        });

        function playEmergencyBeep() {
            if (!audioEnabled) return;
            
            // Create Audio Context
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            const ctx = new AudioContext();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            
            osc.connect(gain);
            gain.connect(ctx.destination);
            
            osc.type = 'square'; // Harsh emergency sound
            osc.frequency.setValueAtTime(880, ctx.currentTime); // A5 Note
            
            // Generate 5 seconds of alternating beeps
            const duration = 5;
            const now = ctx.currentTime;
            for (let i = 0; i < 10; i++) {
                gain.gain.setValueAtTime(0.3, now + i * 0.5); // Beep ON
                gain.gain.setValueAtTime(0, now + i * 0.5 + 0.25); // Beep OFF
            }
            
            osc.start(now);
            osc.stop(now + duration); // Exactly 5 seconds
        }

        // ==========================================
        // 3. STATE & UI LOGIC
        // ==========================================
        let incidents = [];
        let incidentIdCounter = 1;

        function updateStats() {
            const active = incidents.filter(i => i.status !== 'resolved').length;
            const critical = incidents.filter(i => i.severity === 'Critical' && i.status !== 'resolved').length;
            const ack = incidents.filter(i => i.status === 'acknowledged').length;

            document.getElementById('statActive').textContent = active;
            document.getElementById('statCritical').textContent = critical;
            document.getElementById('statAck').textContent = ack;
        }

        function addIncidentToFeed(inc) {
            const feed = document.getElementById('liveFeed');
            const card = document.createElement('div');
            card.className = `incident-card ${inc.severity.toLowerCase()} ${inc.severity === 'Critical' ? 'pulse' : ''}`;
            card.id = `inc-${inc.id}`;
            
            card.innerHTML = `
                <div class="incident-header">
                    <span class="incident-type">${inc.type}</span>
                    <span class="badge badge-${inc.status}">${inc.status}</span>
                </div>
                <div class="incident-loc">📍 ${inc.location} | <strong>${inc.severity}</strong></div>
                <div class="incident-time">Reported: ${inc.time}</div>
                <div class="incident-actions">
                    ${inc.status === 'new' ? `<button class="btn btn-primary btn-sm" onclick="updateStatus(${inc.id}, 'acknowledged')">Acknowledge</button>` : ''}
                    ${inc.status === 'acknowledged' ? `<button class="btn btn-success btn-sm" onclick="updateStatus(${inc.id}, 'resolved')">Resolve</button>` : ''}
                    <button class="btn btn-sm" style="background:var(--border-color);color:white;" onclick="focusMap(${inc.lat}, ${inc.lng})">View on Map</button>
                </div>
            `;
            
            feed.prepend(card);
        }

        function updateStatus(id, newStatus) {
            const inc = incidents.find(i => i.id === id);
            if (inc) {
                inc.status = newStatus;
                // Re-render feed
                document.getElementById('liveFeed').innerHTML = '';
                incidents.forEach(i => addIncidentToFeed(i));
                updateStats();
            }
        }

        function focusMap(lat, lng) {
            map.flyTo([lat, lng], 15);
        }

        function showToast(title, msg) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<div class="toast-title">${title}</div><div class="toast-msg">${msg}</div>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 5000);
        }

        // ==========================================
        // 4. FORM SUBMISSION & MAP MARKERS
        // ==========================================
        document.getElementById('incidentForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            if (!selectedCoords) {
                alert("Please click on the map to select a location first.");
                return;
            }

            const type = document.getElementById('incType').value;
            const severity = document.getElementById('incSeverity').value;
            const location = document.getElementById('incLocation').value;
            const time = new Date().toLocaleTimeString();

            const newInc = {
                id: incidentIdCounter++,
                type, severity, location, time,
                status: 'new',
                lat: selectedCoords.lat,
                lng: selectedCoords.lng
            };

            incidents.unshift(newInc);
            addIncidentToFeed(newInc);
            updateStats();
            placeMarker(newInc);
            showToast(`🚨 NEW ${severity.toUpperCase()} ALERT`, `${type} at ${location}`);

            // Play 5-second beep for Critical or High
            if (severity === 'Critical' || severity === 'High') {
                playEmergencyBeep();
            }

            // Reset form
            this.reset();
            selectedCoords = null;
        });

        function placeMarker(inc) {
            const colorMap = { Critical: 'red', High: 'orange', Medium: 'yellow', Low: 'green' };
            const icon = L.divIcon({
                className: 'custom-marker',
                html: `<div style="background:${colorMap[inc.severity]}; width:20px; height:20px; border-radius:50%; border:3px solid white; box-shadow:0 0 10px rgba(0,0,0,0.5);"></div>`,
                iconSize: [20, 20],
                iconAnchor: [10, 10]
            });

            const marker = L.marker([inc.lat, inc.lng], { icon: icon }).addTo(map);
            marker.bindPopup(`<b>${inc.type}</b><br>Severity: ${inc.severity}<br>${inc.location}`);
            markers.push(marker);
        }

        // ==========================================
        // 5. REAL-TIME SIMULATION ENGINE
        // ==========================================
        function simulateIncoming() {
            const types = ["Vehicle Accident", "Multi-Vehicle Collision", "Pedestrian Incident", "Road Hazard", "Medical Emergency"];
            const severities = ["Critical", "High", "Medium", "Low"];
            
            // Generate random coordinates near current map center
            const center = map.getCenter();
            const lat = center.lat + (Math.random() - 0.5) * 0.05;
            const lng = center.lng + (Math.random() - 0.5) * 0.05;
            
            const type = types[Math.floor(Math.random() * types.length)];
            const severity = severities[Math.floor(Math.random() * severities.length)];
            const time = new Date().toLocaleTimeString();

            const newInc = {
                id: incidentIdCounter++,
                type, severity, 
                location: `${lat.toFixed(5)}, ${lng.toFixed(5)}`, 
                time, status: 'new', lat, lng
            };

            incidents.unshift(newInc);
            addIncidentToFeed(newInc);
            updateStats();
            placeMarker(newInc);
            showToast(`📡 INCOMING DISPATCH`, `${type} detected via sensor network.`);

            if (severity === 'Critical' || severity === 'High') {
                playEmergencyBeep();
            }
        }

        // Auto-simulate an incident every 15-25 seconds to show "Live" capability to judges
        setInterval(() => {
            if (Math.random() > 0.5) simulateIncoming();
        }, 15000);

        // ==========================================
        // 6. LIVE CLOCK & FAKE LATENCY
        // ==========================================
        function updateClock() {
            const now = new Date();
            document.getElementById('liveClock').textContent = now.toLocaleTimeString() + " | " + now.toLocaleDateString();
            // Fake network latency fluctuation
            document.getElementById('latency').textContent = `${Math.floor(Math.random() * 30 + 20)}ms`;
        }
        setInterval(updateClock, 1000);
        updateClock();

    </script>
</body>
</html>
